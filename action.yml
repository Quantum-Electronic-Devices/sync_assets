name: "Sync statics"
description: >
  Copies the assets of the latest release of a source repository over the
  files with the same name in this repository and opens a pull request.
  The calling job must check out the repository first and grant
  `contents: write` and `pull-requests: write`.

inputs:
  repository:
    required: true
    description: "The repository to sync, as <owner>/<repo>."

  version_file:
    required: true
    description: "The file name used to define the static content version."

  remote-token:
    required: true
    description: "A token with read access to the releases of the source repository."

  github-token:
    required: true
    description: "A token that allows pushing a branch and creating a pull request in this repository."

  commit-user-name:
    required: false
    default: "github-actions[bot]"
    description: >
      Login of the account the commit is attributed to, e.g. the login of a
      bot account (or `<app-slug>[bot]` for a GitHub App).

  commit-user-id:
    required: false
    default: "41898282"
    description: >
      Numeric user ID of that account (the default is the ID of github-actions[bot]
      on github.com). Look it up with: gh api users/<login> --jq .id
      (for an app: gh api "users/<app-slug>[bot]" --jq .id). It is used to build the
      commit email <id>+<login>@users.noreply.github.com, which links the commit to the account.

  force-new-pr:
    required: false
    default: "false"
    description: >
      Set to `true` to replace an existing open pull request for the same release:
      it is closed with a comment and a new pull request is opened, so the new one
      is authored by the account `github-token` belongs to. It does not make the
      action run when the version file is already up to date.

runs:
  using: "composite"
  steps:
    - name: Get latest static release tag
      id: static-release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.remote-token }}
        REPOSITORY: ${{ inputs.repository }}
        VERSION_FILE: ${{ inputs.version_file }}
      run: |
        if [[ ! "${REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
          echo "::error::'repository' must look like <owner>/<repo>"
          exit 1
        fi
        if [[ ! "${VERSION_FILE}" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ || "${VERSION_FILE}" == *..* ]]; then
          echo "::error::'version_file' must be a relative path inside the repository"
          exit 1
        fi
        if [[ ! -f "${VERSION_FILE}" ]]; then
          echo "::error::Version file '${VERSION_FILE}' does not exist"
          exit 1
        fi

        LATEST_TAG="$(gh api "repos/${REPOSITORY}/releases/latest" --jq '.tag_name')"
        # The tag ends up in a branch name, a commit message and a PR title.
        if [[ ! "${LATEST_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
          echo "::error::The latest release tag of ${REPOSITORY} is missing or contains unexpected characters"
          exit 1
        fi
        CURRENT_TAG="$(head -c 100 "${VERSION_FILE}" | tr -cd 'A-Za-z0-9._+-')"

        {
          echo "latest_tag=${LATEST_TAG}"
          echo "current_tag=${CURRENT_TAG}"
          echo "current_repo=${REPOSITORY##*/}"
        } >> "${GITHUB_OUTPUT}"

    - name: Update statics
      if: steps.static-release.outputs.current_tag != steps.static-release.outputs.latest_tag
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.remote-token }}
        REPOSITORY: ${{ inputs.repository }}
        VERSION_FILE: ${{ inputs.version_file }}
        LATEST_TAG: ${{ steps.static-release.outputs.latest_tag }}
      run: |
        # Download outside the workspace so it can never end up in the commit.
        dir="${RUNNER_TEMP}/statics"
        rm -rf "${dir}"
        mkdir -p "${dir}"
        gh release download "${LATEST_TAG}" --pattern '*.pdf' -D "${dir}" -R "${REPOSITORY}"

        # Replace repository files whose name is exactly the name of a release
        # asset. Exact string comparison: asset names are chosen by whoever
        # publishes the release, so they must never be used as a glob or as an
        # option to cp.
        declare -A used=()
        while IFS= read -r -d '' target; do
          base="${target##*/}"
          if [[ -f "${dir}/${base}" ]]; then
            cp -- "${dir}/${base}" "${target}"
            used["${base}"]=1
            echo "Updated ${target}"
          fi
        done < <(find . -type f -not -path '*/.*' -print0)

        shopt -s nullglob
        for asset in "${dir}"/*; do
          name="${asset##*/}"
          [[ -n "${used[${name}]:-}" ]] || echo "::warning::Release asset '${name}' matches no file in the repository"
        done

        printf '%s\n' "${LATEST_TAG}" > "${VERSION_FILE}"

    - name: Close existing pull request
      if: steps.static-release.outputs.current_tag != steps.static-release.outputs.latest_tag && inputs.force-new-pr == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        BRANCH: "update_statics/${{ steps.static-release.outputs.current_repo }}/${{ steps.static-release.outputs.latest_tag }}"
      run: |
        while IFS= read -r number; do
          [[ -n "${number}" ]] || continue
          gh pr close "${number}" --repo "${REPO}" \
            --comment "Superseded by a new pull request (forced run ${GITHUB_RUN_ID})."
          echo "Closed pull request #${number}"
        done < <(gh api -X GET "repos/${REPO}/pulls" \
                   -f state=open -f head="${REPO%%/*}:${BRANCH}" \
                   --jq '.[].number')

    - name: Create pull request
      if: steps.static-release.outputs.current_tag != steps.static-release.outputs.latest_tag
      uses: Quantum-Electronic-Devices/create-pull-request@80d2b7f96ef69303d2eca53fac6b55ad21675c9d # v1.0.0
      with:
        github-token: ${{ inputs.github-token }}
        branch: "update_statics/${{ steps.static-release.outputs.current_repo }}/${{ steps.static-release.outputs.latest_tag }}"
        title: "Bump ${{ inputs.repository }} from ${{ steps.static-release.outputs.current_tag }} to ${{ steps.static-release.outputs.latest_tag }}"
        body: "Bumps [${{ inputs.repository }}](https://github.com/${{ inputs.repository }}) from ${{ steps.static-release.outputs.current_tag }} to ${{ steps.static-release.outputs.latest_tag }}."
        labels: dependencies
        commit-user-name: ${{ inputs.commit-user-name }}
        commit-user-id: ${{ inputs.commit-user-id }}
